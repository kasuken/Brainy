name: Deploy to Azure

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: brainy-prod-002

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ format('B7r!{0}xQ9_Test', github.run_id) }}
        ports:
          - 1433:1433
    env:
      BRAINY_TEST_SQL_CONNECTIONSTRING: ${{ format('Server=localhost,1433;Database=master;User Id=sa;Password=B7r!{0}xQ9_Test;TrustServerCertificate=true;Connect Timeout=2', github.run_id) }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Restore tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Verify EF model and migrations agree
        run: dotnet ef migrations has-pending-model-changes --project Brainy.Data --startup-project Brainy.Web --no-build --configuration Release

      - name: Publish
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            dotnet publish Brainy.Web/Brainy.Web.csproj --no-restore --configuration Release --output ./publish -p:Version="$version"
          else
            dotnet publish Brainy.Web/Brainy.Web.csproj --no-restore --configuration Release --output ./publish
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webapp
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    environment:
      name: production
      url: https://www.brainy-me.com

    steps:
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: webapp
          path: ./publish

      - name: Azure login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # appsettings.json ships Billing:Provider=None for self-hosted instances; the hosted
      # service selects Stripe here. Runs before the deploy so a failure leaves production as is.
      - name: Configure hosted billing provider
        run: |
          resource_group=$(az webapp list --query "[?name=='${AZURE_WEBAPP_NAME}'].resourceGroup | [0]" --output tsv)
          test -n "$resource_group" || { echo "Web app ${AZURE_WEBAPP_NAME} not found"; exit 1; }
          az webapp config appsettings set --name "$AZURE_WEBAPP_NAME" --resource-group "$resource_group" \
            --settings Billing__Provider=Stripe --output none

      - name: Deploy to App Service
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            status=$(curl -s -o /dev/null -w "%{http_code}" https://www.brainy-me.com/health/ready) && \
            [ "$status" = "200" ] && echo "Healthy" && exit 0
            echo "Attempt $i: status $status — retrying in 15s"
            sleep 15
          done
          echo "Health check failed" && exit 1

      - name: Security smoke tests
        run: |
          redirect=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" http://www.brainy-me.com/Account/Login)
          case "$redirect" in
            "301 https://"*|"308 https://"*) ;;
            *) echo "HTTP login did not redirect to HTTPS: $redirect"; exit 1 ;
          esac
          test "$(curl -s -o /dev/null -w "%{http_code}" https://www.brainy-me.com/Account/Login)" = "200"
